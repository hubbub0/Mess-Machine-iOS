# XcodeGen spec: the Xcode project is generated from this file (`xcodegen generate`), never edited by hand.
name: MessMachine
# engine.yml links the shared Kotlin engine when CI has built it (tools/build-engine.sh); the committed copy links nothing
include:
  - engine.yml
options:
  bundleIdPrefix: app.shotgunstudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    GCC_C_LANGUAGE_STANDARD: c11
    GCC_WARN_INHIBIT_ALL_WARNINGS: "NO"
targets:
  MessMachine:
    type: application
    platform: iOS
    sources:
      - path: ios/App
        excludes: ["Info.plist"]
      - path: ios/Audio
        excludes: ["test/**"]
      # shared from the Android repo (core/ submodule): fonts, the sound library index, the start guide
      - path: core/ui/src/commonMain/composeResources/font/archivo_medium.ttf
        buildPhase: resources
      - path: core/ui/src/commonMain/composeResources/font/archivo_extrabold.ttf
        buildPhase: resources
      - path: core/ui/src/commonMain/composeResources/font/archivo_black.ttf
        buildPhase: resources
      - path: core/ui/src/commonMain/composeResources/font/bungee.ttf
        buildPhase: resources
      - path: core/ui/src/commonMain/composeResources/font/plexmono_400.ttf
        buildPhase: resources
      - path: core/ui/src/commonMain/composeResources/font/plexmono_700.ttf
        buildPhase: resources
      - path: core/ui/src/commonMain/composeResources/font/share_tech_mono.ttf
        buildPhase: resources
      # the Android app's assets as they are: sounds/ (library.json, one-shots, loops/, hits/) and guide.json
      - path: core/app/src/main/assets
        type: folder
        buildPhase: resources
      # the shared screens' icons and fonts, written by tools/build-engine.sh (absent without the framework)
      - path: build/compose-resources
        type: folder
        buildPhase: resources
        optional: true
      - path: core/shared/fixtures/example.mess.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shotgunstudio.messmachine
        PRODUCT_NAME: MessMachine
        # the shared framework is also called MessMachine, so the app's own Swift module needs another name
        PRODUCT_MODULE_NAME: MessMachineApp
        SWIFT_OBJC_BRIDGING_HEADER: ios/App/Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: ios/App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MessMachineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/Tests
      - path: core/shared/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: MessMachine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: ios/Tests/Tests-Bridging-Header.h
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MessMachine.app/MessMachine"
        BUNDLE_LOADER: "$(TEST_HOST)"
  MessMachineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ios/UITests
    dependencies:
      - target: MessMachine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: MessMachine
schemes:
  MessMachine:
    build:
      targets:
        MessMachine: all
        MessMachineTests: [test]
        MessMachineUITests: [test]
    test:
      targets:
        - MessMachineTests
        - MessMachineUITests
      gatherCoverageData: false
